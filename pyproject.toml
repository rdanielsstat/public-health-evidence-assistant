[project]
name = "public-health-evidence-assistant"
version = "0.1.0"
description = "Evidence-based RAG assistant for public health and health policy questions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dlt>=1.29.0",
    "httpx>=0.28.1",
    "langchain-core>=1.5.0",
    "langchain-openai>=1.4.0",
    "langfuse>=4.14.1",
    "langgraph>=1.2.9",
    "numpy>=2.5.1",
    "openai>=2.47.0",
    "pandas>=3.0.5",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.60.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
